name: CI

# The gate on the way in. deploy.yml runs the same two steps on main, but that
# fires after a merge; this one runs on the branch, so a broken engine or a
# figure that no longer matches its source is caught before it lands.

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the branch name rather than the ref, so the push run and the pull
# request run for the same branch land in one group and the earlier of the two
# is cancelled. Both triggers are wanted (a branch with no pull request open
# still gets checked), but the same commit only needs checking once.
concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
